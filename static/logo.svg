<svg viewBox="170 -20 320 320" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B4C0D1"/>
      <stop offset="55%" stop-color="#8493A8"/>
      <stop offset="100%" stop-color="#48566B"/>
    </linearGradient>
    <radialGradient id="rivetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D7DEE8"/>
      <stop offset="100%" stop-color="#5B6B82"/>

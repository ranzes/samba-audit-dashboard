  <path d="M346.0,222.5 L330.0,264.0 L314.0,222.5 Z" fill="url(#metalGrad)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M283.0,209.6 L242.3,227.7 L260.4,187.0 Z" fill="url(#metalGrad)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>

    <radialGradient id="bossGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E4E9F0"/>
      <stop offset="55%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5872"/>
    </radialGradient>
  </defs>

  <!-- glow behind shield -->

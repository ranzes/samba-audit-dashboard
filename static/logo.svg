  <path d="M260.4,93.0 L242.3,52.3 L283.0,70.4 Z" fill="url(#metalGrad)" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- rivets -->
  <circle cx="368.3" cy="47.6" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="422.4" cy="101.7" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="422.4" cy="178.3" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="368.3" cy="232.4" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="291.7" cy="232.4" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="237.6" cy="178.3" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="237.6" cy="101.7" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>
  <circle cx="291.7" cy="47.6" r="6" fill="url(#rivetGrad)" stroke="#0F172A" stroke-width="1"/>

